<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reviewer — Proof of Address Verification</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="page">
    <h1>Proof of Address — Reviewer</h1>

    <form id="upload-form" action="/api/v1/cases" method="post" enctype="multipart/form-data">
      <label for="customer_id">Customer ID</label>
      <input id="customer_id" name="customer_id" type="text" value="CUST-0001" required>

      <label for="file">Document (PDF, PNG, JPG)</label>
      <input id="file" name="file" type="file" accept=".pdf,.png,.jpg,.jpeg" required>

      <button type="submit">Analyze</button>
    </form>

    <section id="error" class="error" hidden></section>

    <section id="result" hidden>
      <h2>Result</h2>
      <p>Status: <span id="result-status"></span></p>
      <pre id="result-body"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
